<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write</title>

<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 两层 WebGL 背景：雨 / 雪 -->
<canvas id="bg-rain" class="bg-canvas active"></canvas>
<canvas id="bg-snow" class="bg-canvas"></canvas>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">Write</div>

  <div class="weather-switch">
    <button data-weather="rain" class="active">雨</button>
    <button data-weather="snow">雪</button>
  </div>

  <div class="intensity">
    <span class="label">强度</span>
    <input type="range" id="intensity" min="0" max="100" value="60">
  </div>

  <div class="actions">
    <button id="export-btn">导出 .md</button>
    <button id="exit-btn">退出</button>
  </div>
</header>

<!-- 毛玻璃板 -->
<main class="glass-panel">
  <div id="editor"></div>
</main>

<!-- 底部状态 -->
<footer class="statusbar">
  <span id="wordcount">0 字</span>
  <span class="dot">·</span>
  <span id="readtime">0 分钟阅读</span>
</footer>

<!-- Jekyll baseurl 传给 JS -->
<script>
  window.__BASEURL__ = '{{ site.baseurl }}' || '';
</script>

<!-- 依赖 -->
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>

<!-- Shader 源码 -->
<script src="./shader-rain.js"></script>
<script src="./shader-snow.js"></script>

<!-- 主逻辑 -->
<script src="./app.js"></script>
</body>
</html>
